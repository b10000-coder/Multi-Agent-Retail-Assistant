name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  eval:
    name: Eval regression check
    needs: test
    runs-on: ubuntu-latest
    # Runs only once GCP access is configured (repo variables), and only for changes that can
    # affect agent behaviour, or when started by hand. Each run calls Gemini, so it costs money.
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    permissions:
      contents: read
      id-token: write   # OIDC token for Workload Identity Federation (no service account key)
    env:
      TOOLBOX_VERSION: "1.16.0"
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no agent / eval files changed (pull requests)
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -qE '^(retail_agent|evals|toolbox|corpus)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No agent or eval changes; skipping evals." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.run != 'false'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run != 'false'

      - name: Install dependencies
        if: steps.changes.outputs.run != 'false'
        run: uv sync --frozen

      - name: Write agent config (no secrets, only resource names)
        if: steps.changes.outputs.run != 'false'
        run: |
          cat > retail_agent/.env <<ENV
          GOOGLE_GENAI_USE_VERTEXAI=TRUE
          GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION=global
          POLICY_SERVING_CONFIG=${{ vars.POLICY_SERVING_CONFIG }}
          CATALOG_SERVING_CONFIG=${{ vars.CATALOG_SERVING_CONFIG }}
          ENV

      - name: Start MCP Toolbox
        if: steps.changes.outputs.run != 'false'
        run: |
          # Download outside the repo: ./toolbox is the config directory
          TOOLBOX_BIN="$RUNNER_TEMP/toolbox-bin"
          curl -sSfL -o "$TOOLBOX_BIN" "https://storage.googleapis.com/mcp-toolbox-for-databases/v${TOOLBOX_VERSION}/linux/amd64/toolbox"
          chmod +x "$TOOLBOX_BIN"
          "$TOOLBOX_BIN" --config toolbox/tools.yaml > toolbox.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:5000/; then echo "Toolbox is up"; exit 0; fi
            sleep 1
          done
          echo "Toolbox did not start"; cat toolbox.log; exit 1

      - name: Run evals and compare with baseline
        if: steps.changes.outputs.run != 'false'
        run: uv run python evals/run_evals.py

      - name: Upload eval results
        if: always() && steps.changes.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/latest.json
            toolbox.log
          if-no-files-found: ignore
