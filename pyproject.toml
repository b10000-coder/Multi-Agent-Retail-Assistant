[project]
name = "multi-agent-retail-assistant"
version = "0.1.0"
description = "Multi-agent retail operations assistant on Google ADK and Vertex AI"
authors = [
    { name = "b10000-coder", email = "247021257+b10000-coder@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "google-adk>=2.14.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-discoveryengine>=0.20.7",
    "google-cloud-storage>=3.17.1",
    "markdown>=3.11.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pandas-gbq>=0.35.3",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "toolbox-core>=1.4.0",
    "uvicorn>=0.54.0",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: hits real GCP services"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"


[tool.ruff]
line-length = 120
target-version = "py312"